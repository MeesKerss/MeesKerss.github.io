<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Battleships</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../shared/css/reset.css"/>
<link rel="stylesheet" href="../shared/css/components.css"/>
<link rel="stylesheet" href="css/style.css"/>
<script src="../shared/js/audio.js" defer></script>
<script src="js/main.js" defer></script>
</head>
<body>

<div id="setup">
  <div class="sbox">
    <h1 class="s-title">Battleships</h1>
    <div class="s-sect">
      <div class="s-lbl">Grid Size</div>
      <div class="cnt-row" id="grid-btns">
        <button class="cnt" data-s="8">8x8</button>
        <button class="cnt on" data-s="10">10x10</button>
      </div>
    </div>
    <div class="s-sect">
      <div class="s-lbl">After a Hit</div>
      <div class="cnt-row" id="rule-btns">
        <button class="cnt on" data-r="again">Fire again</button>
        <button class="cnt" data-r="pass">Pass turn</button>
      </div>
    </div>
    <div class="s-sect">
      <div class="s-lbl">Ships May Touch</div>
      <div class="cnt-row" id="touch-btns">
        <button class="cnt on" data-t="no">No</button>
        <button class="cnt" data-t="yes">Yes</button>
      </div>
    </div>
    <div class="s-sect">
      <div class="s-lbl">Names</div>
      <div class="name-list" id="name-list"></div>
    </div>
    <button class="btn-start" id="start-btn">Start Game</button>
  </div>
</div>

<div id="app">
  <div class="hdr">
    <span class="hdr-logo">Battleships</span>
    <div class="hdr-right">
      <div class="hdr-info">
        <span class="hdr-player" id="h-player"></span>
        <span class="hdr-round" id="h-round"></span>
      </div>
      <button id="btn-restart" class="hdr-btn" title="Restart Game">↺</button>
    </div>
  </div>

  <div class="score-strip" id="score-strip"></div>

  <div class="game-area">
    <div class="b-lbl" id="main-lbl"></div>
    <div class="bwrap" id="main-wrap">
      <div class="b-cols" id="main-cols"></div>
      <div class="b-rows" id="main-rows"></div>
      <div class="board" id="main-board"></div>
    </div>

    <!-- Placement controls -->
    <div id="place-ctrl" class="place-ctrl">
      <div class="chips" id="chips"></div>
      <div class="pc-row">
        <button class="btn-ghost" id="btn-rotate">⟳ Rotate</button>
        <button class="btn-ghost" id="btn-random">Random</button>
        <button class="btn-pill" id="btn-done" disabled>Done</button>
      </div>
    </div>

    <!-- Own fleet during battle -->
    <div id="own-sec" class="own-sec">
      <div class="own-map">
        <div class="b-lbl">Your fleet</div>
        <div class="board small" id="own-board"></div>
      </div>
      <div class="fleet-list" id="fleet-list"></div>
    </div>
  </div>
</div>

<!-- Hand-off screen: hides everything between turns -->
<div id="pass">
  <div class="sbox pass-box">
    <div class="s-lbl">Pass the device to</div>
    <div class="pass-name" id="pass-name"></div>
    <div class="pass-sub" id="pass-sub"></div>
    <div class="pass-news" id="pass-news"></div>
    <button class="btn-start" id="pass-btn">I'm ready</button>
  </div>
</div>

<div id="notif">
  <div class="ndot" id="n-dot"></div>
  <span id="n-txt"></span>
</div>

<div id="over">
  <h2 class="over-title">Game Over</h2>
  <div class="over-card" id="over-card"></div>
  <button class="btn-again" id="btn-play-again">Play Again</button>
</div>

</body>
</html>
