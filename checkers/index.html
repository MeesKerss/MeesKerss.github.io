<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Checkers</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../shared/css/reset.css"/>
<link rel="stylesheet" href="../shared/css/components.css"/>
<link rel="stylesheet" href="css/style.css"/>
<script src="../shared/js/audio.js" defer></script>
<script src="js/main.js" defer></script>
</head>
<body>

<div id="setup">
  <div class="sbox">
    <h1 class="s-title">Checkers</h1>
    <div class="s-sect">
      <div class="s-lbl">Rules</div>
      <div class="cnt-row" id="rule-btns">
        <button class="cnt on" data-r="intl">International</button>
        <button class="cnt" data-r="english">English</button>
      </div>
    </div>
    <div class="s-sect">
      <div class="s-lbl">Layout</div>
      <div class="cnt-row" id="layout-btns">
        <button class="cnt" data-l="f2f">Face to face</button>
        <button class="cnt" data-l="same">Same side</button>
      </div>
    </div>
    <div class="s-sect">
      <div class="s-lbl">Names</div>
      <div class="name-list" id="name-list"></div>
    </div>
    <button class="btn-start" id="start-btn">Start Game</button>
  </div>
</div>

<div id="app">
  <div class="hdr">
    <span class="hdr-logo">Checkers</span>
    <button id="btn-restart" class="hdr-btn" title="Restart Game">↺</button>
  </div>

  <!-- Face to face (body.f2f): player 2 sits across the table, so their panel is upside down -->
  <div class="ppanel flip" id="panel-1"></div>

  <div class="game-area">
    <div id="board-wrap">
      <div id="board">
        <!-- Squares and pieces are generated by JS -->
      </div>
    </div>
  </div>

  <div class="ppanel" id="panel-0"></div>
</div>

<div id="over">
  <div class="over-half flip" id="over-top"></div>
  <button class="btn-again" id="btn-play-again">Play Again</button>
  <div class="over-half" id="over-bot"></div>
</div>

</body>
</html>
