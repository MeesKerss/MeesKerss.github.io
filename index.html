<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>mkers.nl</title>
<meta name="description" content="A collection of party games. No accounts, no app. Just open and play."/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  background: #f0ede8;
  color: #111;
}

/* ─── Full-width scene wrapper ──────────────────── */

.scene {
  width: 100%;
  height: 100vh;
  position: relative;
  display: flex;
  justify-content: center;
}

/* ─── Abstract window — left wall ──────────────── */

.window {
  display: none;
  position: absolute;
  left: calc(50% - 340px);   /* sits left of the page card */
  top: 72px;
  width: 100px;
  height: 160px;
  transform: translateX(-100%);
  margin-left: 28px;
}

@media (min-width: 820px) {
  .window { display: block; }
}

/* Outer frame — stark, dark, minimal */
.window-frame {
  position: absolute;
  inset: 0;
  background: #111;
  border-radius: 1px;
  box-shadow: 4px 4px 0 #000, 0 12px 32px rgba(0,0,0,0.12);
}

/* 2×2 pane grid */
.window-panes {
  position: absolute;
  inset: 8px;
  display: grid;
  grid-template-columns: 1fr 8px 1fr;
  grid-template-rows: 1fr 8px 1fr;
  background: #111;
}

.window-panes .pane {
  /* Panes: white — like frosted or diffuse light */
  background: #f8f8f6;
  /* Subtle top-lit gradient, keeps it from being flat */
  background: linear-gradient(175deg, #fff 0%, #f0efec 100%);
}

.window-panes .cross { background: #111; }

/* ─── Abstract painting — right wall ────────────── */

.painting {
  display: none;
  position: absolute;
  right: calc(50% - 340px);
  top: 100px;
  transform: translateX(100%);
  margin-right: 28px;
}

@media (min-width: 820px) {
  .painting { display: block; }
}

/* Dark, minimal frame */
.painting-frame {
  width: 90px;
  height: 116px;
  background: #111;
  box-shadow: 4px 4px 0 #000, 0 12px 28px rgba(0,0,0,0.12);
  padding: 7px;
  border-radius: 1px;
}

/* Cream mat board — same tone as the game background */
.painting-mat {
  width: 100%;
  height: 100%;
  background: #f0ede8;
  position: relative;
  overflow: hidden;
  border-radius: 1px;
}

/* The abstract art — player palette colors, bold geometric shapes */
.painting-mat::before {
  content: '';
  position: absolute;
  /* Amber circle — Player 1 */
  width: 52px; height: 52px;
  border-radius: 50%;
  background: #d97706;
  bottom: -14px; left: -12px;
}
.painting-mat::after {
  content: '';
  position: absolute;
  /* Blue rectangle — Player 2 */
  width: 42px; height: 30px;
  background: #2563eb;
  top: 8px; right: -8px;
  transform: rotate(-8deg);
}

/* Green and red shapes sit inside a non-pseudo container */
.painting-shapes {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}
.painting-shapes::before {
  content: '';
  position: absolute;
  /* Green square — Player 3 */
  width: 26px; height: 26px;
  background: #16a34a;
  top: 18px; left: 8px;
  transform: rotate(22deg);
  border-radius: 2px;
  opacity: 0.85;
}
.painting-shapes::after {
  content: '';
  position: absolute;
  /* Red sliver — Player 4 */
  width: 38px; height: 10px;
  background: #dc2626;
  bottom: 14px; right: 4px;
  transform: rotate(-15deg);
  opacity: 0.9;
}

/* ─── Page shell ────────────────────────────────── */

.page {
  width: 100%;
  max-width: 500px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 10;
}

/* ─── Header ────────────────────────────────────── */

.hdr {
  flex-shrink: 0;
  background: #fff;
  border-bottom: 1px solid #e8e5e0;
  padding: 0.75rem 1.25rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.hdr-logo {
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: -0.01em;
}

.hdr-sub {
  font-size: 0.7rem;
  font-weight: 600;
  color: #bbb;
}

/* ─── Shelves ───────────────────────────────────── */

.shelves {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 1.25rem;
  gap: 1.25rem;
  overflow: hidden;
}

.shelf {
  flex: 1;
  display: flex;
  align-items: flex-end;
  gap: 1rem;
  position: relative;
  padding-bottom: 10px;
}

.shelf::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: -1.25rem; right: -1.25rem;
  height: 1px;
  background: #e8e5e0;
  box-shadow: 0 3px 8px rgba(0,0,0,0.05);
}

.shelf:last-child::after { display: none; }

/* ─── Game boxes ────────────────────────────────── */

.game-box {
  flex: 1;
  min-width: 0;
  text-decoration: none;
  color: #111;
  background: #fff;
  border-radius: 16px;
  border: 1.5px solid #e8e5e0;
  border-top: 3px solid var(--accent, #e8e5e0);
  box-shadow: 0 4px 20px rgba(0,0,0,0.05);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 1rem 0.75rem;
  transition: transform 0.12s cubic-bezier(0.32, 0.72, 0, 1),
              box-shadow 0.12s cubic-bezier(0.32, 0.72, 0, 1);
  -webkit-tap-highlight-color: transparent;
}

.game-box:active {
  transform: scale(0.96);
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.box-1 { --accent: #d97706; height: 130px; }
.box-2 { --accent: #2563eb; height: 116px; }
.box-3 { --accent: #16a34a; height: 122px; }
.box-4 { --accent: #7c3aed; height: 110px; }
.box-5 { --accent: #dc2626; height: 128px; }
.box-6 { --accent: #0891b2; height: 114px; }

.box-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent, #ccc);
  margin-bottom: 0.5rem;
  flex-shrink: 0;
}

.g-title {
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.2;
  margin-bottom: 0.25rem;
}

.g-players {
  font-size: 0.58rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #bbb;
}

/* ─── Reduced motion ────────────────────────────── */

@media (prefers-reduced-motion: reduce) {
  .game-box { transition: none; }
}
</style>
</head>
<body>

<div class="scene">

  <!-- Abstract window — left of the page card, desktop only -->
  <div class="window">
    <div class="window-frame"></div>
    <div class="window-panes">
      <span class="pane"></span>
      <span class="cross"></span>
      <span class="pane"></span>
      <span class="cross"></span>
      <span class="cross"></span>
      <span class="cross"></span>
      <span class="pane"></span>
      <span class="cross"></span>
      <span class="pane"></span>
    </div>
  </div>

  <!-- Main page -->
  <div class="page">

    <div class="hdr">
      <span class="hdr-logo">mkers.nl</span>
    </div>

    <div class="shelves">

      <div class="shelf">
        <a href="/yahtzee/" class="game-box box-1">
          <div class="box-dot"></div>
          <span class="g-title">Yahtzee</span>
          <span class="g-players">1–4 Players</span>
        </a>
        <a href="/connect4/" class="game-box box-2">
          <div class="box-dot"></div>
          <span class="g-title">Connect 4</span>
          <span class="g-players">2 Players</span>
        </a>
      </div>

      <div class="shelf">
        <a href="/memory/" class="game-box box-3">
          <div class="box-dot"></div>
          <span class="g-title">Memory</span>
          <span class="g-players">2–4 Players</span>
        </a>
        <a href="/dotsboxes/" class="game-box box-4">
          <div class="box-dot"></div>
          <span class="g-title">Dots &amp; Boxes</span>
          <span class="g-players">2–4 Players</span>
        </a>
      </div>

      <div class="shelf">
        <a href="/liarsdice/" class="game-box box-5">
          <div class="box-dot"></div>
          <span class="g-title">Liar's Dice</span>
          <span class="g-players">2–4 Players</span>
        </a>
        <a href="/mancala/" class="game-box box-6">
          <div class="box-dot"></div>
          <span class="g-title">Mancala</span>
          <span class="g-players">2 Players</span>
        </a>
      </div>

    </div>
  </div>

  <!-- Abstract painting — right of the page card, desktop only -->
  <div class="painting">
    <div class="painting-frame">
      <div class="painting-mat">
        <div class="painting-shapes"></div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
