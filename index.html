<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>mkers.nl</title>
<meta name="description" content="A collection of party games. No accounts, no app. Just open and play."/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  background: #f0ede8;
  color: #111;
}

/* ─── Full-width scene wrapper ──────────────────── */

.scene {
  width: 100%;
  height: 100vh;
  position: relative;
  display: flex;
  justify-content: center;
}

/* ─── Abstract window — left wall ──────────────── */

.window {
  display: none;
  position: absolute;
  left: calc(50% - 340px);   /* sits left of the page card */
  top: 72px;
  width: 100px;
  height: 160px;
  transform: translateX(-100%);
  margin-left: 28px;
}

@media (min-width: 820px) {
  .window { display: block; }
}

/* Outer frame — stark, dark, minimal */
.window-frame {
  position: absolute;
  inset: 0;
  background: #111;
  border-radius: 1px;
  box-shadow: 4px 4px 0 #000, 0 12px 32px rgba(0,0,0,0.12);
}

/* 2×2 pane grid */
.window-panes {
  position: absolute;
  inset: 8px;
  display: grid;
  grid-template-columns: 1fr 8px 1fr;
  grid-template-rows: 1fr 8px 1fr;
  background: #111;
}

.window-panes .pane {
  /* Panes: white — like frosted or diffuse light */
  background: #f8f8f6;
  /* Subtle top-lit gradient, keeps it from being flat */
  background: linear-gradient(175deg, #fff 0%, #f0efec 100%);
}

.window-panes .cross { background: #111; }

/* ─── Abstract painting — right wall ────────────── */

.painting {
  display: none;
  position: absolute;
  right: calc(50% - 340px);
  top: 100px;
  transform: translateX(100%);
  margin-right: 28px;
}

@media (min-width: 820px) {
  .painting { display: block; }
}

/* Dark, minimal frame */
.painting-frame {
  width: 90px;
  height: 116px;
  background: #111;
  box-shadow: 4px 4px 0 #000, 0 12px 28px rgba(0,0,0,0.12);
  padding: 7px;
  border-radius: 1px;
}

/* Cream mat board — same tone as the game background */
.painting-mat {
  width: 100%;
  height: 100%;
  background: #f0ede8;
  position: relative;
  overflow: hidden;
  border-radius: 1px;
}

/* The abstract art — player palette colors, bold geometric shapes */
.painting-mat::before {
  content: '';
  position: absolute;
  /* Amber circle — Player 1 */
  width: 52px; height: 52px;
  border-radius: 50%;
  background: #d97706;
  bottom: -14px; left: -12px;
}
.painting-mat::after {
  content: '';
  position: absolute;
  /* Blue rectangle — Player 2 */
  width: 42px; height: 30px;
  background: #2563eb;
  top: 8px; right: -8px;
  transform: rotate(-8deg);
}

/* Green and red shapes sit inside a non-pseudo container */
.painting-shapes {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}
.painting-shapes::before {
  content: '';
  position: absolute;
  /* Green square — Player 3 */
  width: 26px; height: 26px;
  background: #16a34a;
  top: 18px; left: 8px;
  transform: rotate(22deg);
  border-radius: 2px;
  opacity: 0.85;
}
.painting-shapes::after {
  content: '';
  position: absolute;
  /* Red sliver — Player 4 */
  width: 38px; height: 10px;
  background: #dc2626;
  bottom: 14px; right: 4px;
  transform: rotate(-15deg);
  opacity: 0.9;
}

/* ─── Page shell ────────────────────────────────── */

.page {
  width: 100%;
  max-width: 500px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 10;
}

/* ─── Header ────────────────────────────────────── */

.hdr {
  flex-shrink: 0;
  background: #fff;
  border-bottom: 1px solid #e8e5e0;
  padding: 0.75rem 1.25rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.hdr-logo {
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: -0.01em;
}

.hdr-sub {
  font-size: 0.7rem;
  font-weight: 600;
  color: #bbb;
}

/* ─── Game list ─────────────────────────────────── */

.game-list {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 1rem 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 0.625rem;
}

.game-row {
  text-decoration: none;
  color: #111;
  background: #fff;
  border-radius: 12px;
  border: 1.5px solid #e8e5e0;
  border-left: 4px solid var(--accent, #e8e5e0);
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  display: flex;
  align-items: center;
  gap: 0.875rem;
  padding: 0.875rem 1rem;
  transition: transform 0.12s cubic-bezier(0.32, 0.72, 0, 1),
              box-shadow 0.12s cubic-bezier(0.32, 0.72, 0, 1);
  -webkit-tap-highlight-color: transparent;
}

.game-row:active {
  transform: scale(0.98);
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}

.row-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent, #ccc);
  flex-shrink: 0;
}

.row-info {
  flex: 1;
  min-width: 0;
}

.g-title {
  font-size: 0.95rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.g-players {
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #bbb;
  margin-top: 0.2rem;
}

.row-arrow {
  color: #ccc;
  font-size: 1rem;
  flex-shrink: 0;
}

/* ─── Reduced motion ────────────────────────────── */

@media (prefers-reduced-motion: reduce) {
  .game-row { transition: none; }
}
</style>
</head>
<body>

<div class="scene">

  <!-- Abstract window — left of the page card, desktop only -->
  <div class="window">
    <div class="window-frame"></div>
    <div class="window-panes">
      <span class="pane"></span>
      <span class="cross"></span>
      <span class="pane"></span>
      <span class="cross"></span>
      <span class="cross"></span>
      <span class="cross"></span>
      <span class="pane"></span>
      <span class="cross"></span>
      <span class="pane"></span>
    </div>
  </div>

  <!-- Main page -->
  <div class="page">

    <div class="hdr">
      <span class="hdr-logo">mkers.nl</span>
    </div>

    <div class="game-list">

      <a href="/yahtzee/" class="game-row" style="--accent: #d97706">
        <div class="row-dot"></div>
        <div class="row-info">
          <div class="g-title">Yahtzee</div>
          <div class="g-players">1–4 Players</div>
        </div>
        <span class="row-arrow">›</span>
      </a>

      <a href="/connect4/" class="game-row" style="--accent: #2563eb">
        <div class="row-dot"></div>
        <div class="row-info">
          <div class="g-title">Connect 4</div>
          <div class="g-players">2 Players</div>
        </div>
        <span class="row-arrow">›</span>
      </a>

      <a href="/memory/" class="game-row" style="--accent: #16a34a">
        <div class="row-dot"></div>
        <div class="row-info">
          <div class="g-title">Memory</div>
          <div class="g-players">2–4 Players</div>
        </div>
        <span class="row-arrow">›</span>
      </a>

      <a href="/dotsboxes/" class="game-row" style="--accent: #7c3aed">
        <div class="row-dot"></div>
        <div class="row-info">
          <div class="g-title">Dots &amp; Boxes</div>
          <div class="g-players">2–4 Players</div>
        </div>
        <span class="row-arrow">›</span>
      </a>

      <a href="/liarsdice/" class="game-row" style="--accent: #dc2626">
        <div class="row-dot"></div>
        <div class="row-info">
          <div class="g-title">Liar's Dice</div>
          <div class="g-players">2–4 Players</div>
        </div>
        <span class="row-arrow">›</span>
      </a>

      <a href="/mancala/" class="game-row" style="--accent: #0891b2">
        <div class="row-dot"></div>
        <div class="row-info">
          <div class="g-title">Mancala</div>
          <div class="g-players">2 Players</div>
        </div>
        <span class="row-arrow">›</span>
      </a>

      <a href="/battleships/" class="game-row" style="--accent: #475569">
        <div class="row-dot"></div>
        <div class="row-info">
          <div class="g-title">Battleships</div>
          <div class="g-players">2 Players</div>
        </div>
        <span class="row-arrow">›</span>
      </a>

      <a href="/farkle/" class="game-row" style="--accent: #65a30d">
        <div class="row-dot"></div>
        <div class="row-info">
          <div class="g-title">Farkle</div>
          <div class="g-players">1–4 Players</div>
        </div>
        <span class="row-arrow">›</span>
      </a>

      <a href="/chess/" class="game-row" style="--accent: #1f2937">
        <div class="row-dot"></div>
        <div class="row-info">
          <div class="g-title">Chess</div>
          <div class="g-players">2 Players</div>
        </div>
        <span class="row-arrow">›</span>
      </a>

      <a href="/checkers/" class="game-row" style="--accent: #db2777">
        <div class="row-dot"></div>
        <div class="row-info">
          <div class="g-title">Checkers</div>
          <div class="g-players">2 Players</div>
        </div>
        <span class="row-arrow">›</span>
      </a>

      <a href="/findthestation/" class="game-row" style="--accent: #4f46e5">
        <div class="row-dot"></div>
        <div class="row-info">
          <div class="g-title">Find the Station</div>
          <div class="g-players">1 Player · Map quiz</div>
        </div>
        <span class="row-arrow">›</span>
      </a>

    </div>
  </div>

  <!-- Abstract painting — right of the page card, desktop only -->
  <div class="painting">
    <div class="painting-frame">
      <div class="painting-mat">
        <div class="painting-shapes"></div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
