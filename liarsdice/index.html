<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Liar's Dice</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../shared/css/reset.css"/>
<link rel="stylesheet" href="../shared/css/components.css"/>
<link rel="stylesheet" href="css/style.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script src="../shared/js/audio.js" defer></script>
<script src="js/main.js" defer></script>
</head>
<body>

<div id="setup">
  <div class="sbox">
    <h1 class="s-title">Liar's Dice</h1>
    <div class="s-sect">
      <div class="s-lbl">Players</div>
      <div class="cnt-row" id="player-btns">
        <button class="cnt on" data-n="2">2</button>
        <button class="cnt" data-n="3">3</button>
        <button class="cnt" data-n="4">4</button>
      </div>
    </div>
    <div class="s-sect">
      <div class="s-lbl">Names</div>
      <div class="name-list" id="name-list"></div>
    </div>
    <button class="btn-start" id="start-btn">Start Game</button>
  </div>
</div>

<div id="app">
  <div class="hdr">
    <span class="hdr-logo">Liar's Dice</span>
    <div class="hdr-right">
      <div class="hdr-info">
        <span class="hdr-player" id="h-player"></span>
      </div>
      <button id="btn-restart" class="hdr-btn" title="Restart Game">↺</button>
    </div>
  </div>
  
  <div class="score-strip" id="score-strip">
    <!-- Player dice counts (e.g. 5 dice remaining) injected here -->
  </div>

  <div class="phase-banner" id="phase-banner">
    <!-- Messages like "Pass to Player 2" or "Player 1 bid 3x ⚄" -->
  </div>

  <div class="game-area" id="game-area">
    <!-- 3D Canvas sits here, taking up the center -->
    <div id="dice-container"></div>
    <div id="peek-overlay" class="peek-overlay">
      <span class="peek-txt">Hold to Peek</span>
    </div>
  </div>

  <div class="controls" id="controls">
    <!-- Contextual controls based on phase -->
    <div id="ctrl-roll" style="display:none;">
      <button class="btn-primary" id="btn-roll">Roll Dice</button>
    </div>
    
    <div id="ctrl-bid" style="display:none;">
      <div class="bid-inputs">
        <div class="bid-col">
          <label>Quantity</label>
          <div class="stepper">
            <button id="btn-q-down">-</button>
            <span id="bid-q">1</span>
            <button id="btn-q-up">+</button>
          </div>
        </div>
        <div class="bid-col">
          <label>Face</label>
          <div class="stepper">
            <button id="btn-f-down">-</button>
            <span id="bid-f" class="dice-font">⚀</span>
            <button id="btn-f-up">+</button>
          </div>
        </div>
      </div>
      <div class="bid-actions">
        <button class="btn-secondary" id="btn-liar">Call Liar!</button>
        <button class="btn-primary" id="btn-submit-bid">Place Bid</button>
      </div>
    </div>

    <div id="ctrl-reveal" style="display:none;">
      <button class="btn-primary" id="btn-next-round">Next Round</button>
    </div>
  </div>
</div>

<div id="notif">
  <div class="ndot" id="n-dot"></div>
  <span id="n-txt"></span>
</div>

<div id="over">
  <h2 class="over-title">Game Over</h2>
  <div class="over-card" id="over-card"></div>
  <button class="btn-again" id="btn-play-again">Play Again</button>
</div>

</body>
</html>
